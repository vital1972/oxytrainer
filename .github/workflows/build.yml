name: Build APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      # Постоянная подпись: без неё каждая сборка получает случайный ключ и не ставится поверх предыдущей.
      - name: Prepare signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shared.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/shared.keystore" >> "$GITHUB_ENV"
            echo "Signing with the shared key"
          else
            echo "::warning::Секреты подписи не заданы: APK подписан случайным ключом и не обновит установленную версию"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing certificate
        env:
          # Отпечаток ключа Android Studio (debug.keystore), которым подписана установленная на телефоне версия. Это публичный отпечаток, не секрет.
          EXPECTED_CERT_SHA256: 653faa8a4eaccbd966e238c5b2e65334b4503cd7c5a00cd70f2a84cd216463d7
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "certificate SHA-256" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "APK certificate SHA-256: $ACTUAL"
          if [ -n "$KEYSTORE_BASE64" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Подпись APK не совпадает с ключом установленного приложения"; exit 1
          fi
          echo "$ACTUAL" > cert-sha256.txt

      - name: Collect debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OxyCareTrainer-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OxyCareTrainer-debug-apk
          path: OxyCareTrainer-*-debug.apk

      - name: Build release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Релиз без постоянной подписи нельзя: добавьте секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"; exit 1; fi
          ./gradlew assembleRelease --no-daemon
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/oxycare-$VERSION.apk"
          (cd dist && sha256sum "oxycare-$VERSION.apk" > "oxycare-$VERSION.apk.sha256")

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
